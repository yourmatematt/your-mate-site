    <script>
      // Mobile menu
      var hamburger = document.getElementById('nav-hamburger');
      var mobileMenu = document.getElementById('mobile-menu');
      hamburger.addEventListener('click', function() {
        hamburger.classList.toggle('active');
        mobileMenu.classList.toggle('active');
        document.body.classList.toggle('menu-open');
      });
      document.querySelectorAll('.mobile-menu-nav a').forEach(function(link) {
        link.addEventListener('click', function() {
          hamburger.classList.remove('active');
          mobileMenu.classList.remove('active');
          document.body.classList.remove('menu-open');
        });
      });

      // Footer rotation — will be updated with project.footer_location
      var footerLocations = ['MALLACOOTA', 'BAIRNSDALE', 'SALE', 'TRARALGON', 'MERIMBULA', 'BEGA', 'EAST GIPPSLAND'];
      var footerLocationIndex = 0;
      var footerLocationEl = document.getElementById('footer-location');
      if (footerLocationEl) {
        footerLocationEl.style.transition = 'opacity 500ms ease-in-out';
        setInterval(function() {
          footerLocationEl.style.opacity = '0';
          setTimeout(function() {
            footerLocationIndex = (footerLocationIndex + 1) % footerLocations.length;
            footerLocationEl.textContent = footerLocations[footerLocationIndex];
            footerLocationEl.style.opacity = '1';
          }, 500);
        }, 3000);
      }

      // Helpers
      function esc(text) {
        var div = document.createElement('div');
        div.textContent = text || '';
        return div.innerHTML;
      }

      // Extract slug from URL: /project/hammond-properties → hammond-properties
      var pathParts = window.location.pathname.split('/').filter(Boolean);
      var slug = pathParts.length >= 2 ? pathParts[pathParts.length - 1] : null;

      if (!slug) {
        window.location.href = '/work';
      } else {
        loadProject(slug);
      }

      function loadProject(slug) {
        fetch('/api/projects/' + encodeURIComponent(slug))
          .then(function(res) {
            if (!res.ok) throw new Error('Not found');
            return res.json();
          })
          .then(function(project) {
            renderProject(project);
            // Update meta tags
            document.title = esc(project.name) + ' | Your Mate Agency';
            var metaDesc = document.querySelector('meta[name="description"]');
            if (metaDesc) metaDesc.setAttribute('content', 'Case study: ' + project.tagline + ' — Your Mate Agency');
            var ogTitle = document.querySelector('meta[property="og:title"]');
            if (ogTitle) ogTitle.setAttribute('content', project.name + ' — Your Mate Agency');
            var ogDesc = document.querySelector('meta[property="og:description"]');
            if (ogDesc) ogDesc.setAttribute('content', 'Case study: ' + project.tagline);
            var ogUrl = document.querySelector('meta[property="og:url"]');
            if (ogUrl) ogUrl.setAttribute('content', 'https://yourmateagency.com.au/project/' + slug);
            // Set footer location
            if (project.footer_location && footerLocationEl) {
              footerLocationEl.textContent = project.footer_location;
            }
          })
          .catch(function() {
            window.location.href = '/work';
          });
      }

      function renderProject(project) {
        // Hero
        document.getElementById('hero-title').textContent = project.name.toUpperCase();
        document.getElementById('hero-subtitle').textContent = project.tagline;

        // Hero image
        var heroSrc = project.hero_image_url || '/work/' + project.slug + '-hero.webp';
        if (heroSrc) {
          var heroWrap = document.getElementById('hero-image-wrap');
          var heroImg = document.getElementById('hero-image');
          heroImg.src = heroSrc;
          heroImg.alt = project.name + ' website';
          heroWrap.style.display = 'block';
        }

        var sections = document.getElementById('dynamic-sections');
        var html = '';

        // Overview
        if (project.overview) {
          var overviewParagraphs = project.overview.split('\n\n').map(function(p) {
            return '<p>' + esc(p.trim()) + '</p>';
          }).join('');

          html += '<section class="case-section">' +
            '<div class="two-column">' +
              '<div class="section-label">OVERVIEW</div>' +
              '<div class="section-content">' + overviewParagraphs + '</div>' +
            '</div>' +
          '</section>';
        }

        // YMA Role
        if (project.roles && project.roles.length > 0) {
          var roleItems = project.roles.map(function(role) {
            return '<div class="service-item">' +
              '<div class="service-header">' +
                '<span>' + esc(role.toUpperCase()) + '</span>' +
                '<span class="toggle-icon">+</span>' +
              '</div>' +
            '</div>';
          }).join('');

          html += '<section class="case-section case-section--no-top">' +
            '<div class="two-column">' +
              '<div class="section-label">YMA ROLE</div>' +
              '<div class="section-content">' +
                '<div class="role-list">' + roleItems + '</div>' +
              '</div>' +
            '</div>' +
          '</section>';
        }

        // Results
        var results = project.results || [];
        if (results.length > 0) {
          var resultsContent = '';
          if (project.results_status === 'tbd') {
            resultsContent = '<div class="stat-item">' +
              '<span class="stat-tbd">TBD</span>' +
              '<span class="stat-tbd-label">Just launched — watch this space.</span>' +
            '</div>';
          } else {
            var statsItems = results.map(function(r) {
              return '<div class="stat-item">' +
                '<span class="stat-number">' + esc(r.stat) + '</span>' +
                '<span class="stat-label">' + esc(r.description) + '</span>' +
              '</div>';
            }).join('');
            resultsContent = '<div class="stats-container">' + statsItems + '</div>';
          }

          html += '<section class="case-section case-section--no-top">' +
            '<div class="two-column">' +
              '<div class="section-label">RESULTS</div>' +
              '<div class="section-content">' + resultsContent + '</div>' +
            '</div>' +
          '</section>';
        }

        // Testimonial
        if (project.testimonial_quote) {
          var quoteText = project.testimonial_quote.split('\n\n').map(function(p) {
            return '<p>' + esc(p.trim()) + '</p>';
          }).join('');

          html += '<section class="case-section case-section--no-top">' +
            '<div class="two-column">' +
              '<div class="section-label">TESTIMONIAL</div>' +
              '<div class="section-content">' +
                '<div class="testimonial-quote">' +
                  '<p>"' + esc(project.testimonial_quote) + '"</p>' +
                '</div>' +
                '<div class="testimonial-author">' +
                  '<span class="testimonial-author-name">' + esc(project.testimonial_name) + '</span>' +
                  '<span class="testimonial-author-title">' + esc(project.testimonial_title) + '</span>' +
                '</div>' +
              '</div>' +
            '</div>' +
          '</section>';
        }

        // Screenshots
        var screenshots = project.screenshot_urls || [];
        if (screenshots.length > 0) {
          var screenshotHtml = '<section class="screenshots-section">';
          // Row 1: first 2 images
          if (screenshots.length >= 2) {
            screenshotHtml += '<div class="screenshots-row-1">' +
              '<img src="' + esc(screenshots[0]) + '" alt="' + esc(project.name) + ' screenshot 1">' +
              '<img src="' + esc(screenshots[1]) + '" alt="' + esc(project.name) + ' screenshot 2">' +
            '</div>';
          } else if (screenshots.length === 1) {
            screenshotHtml += '<div class="screenshots-row-1">' +
              '<img src="' + esc(screenshots[0]) + '" alt="' + esc(project.name) + ' screenshot 1">' +
            '</div>';
          }
          // Row 2: remaining images in pairs
          if (screenshots.length > 2) {
            var remaining = screenshots.slice(2);
            for (var i = 0; i < remaining.length; i += 2) {
              screenshotHtml += '<div class="screenshots-row-2">';
              screenshotHtml += '<img src="' + esc(remaining[i]) + '" alt="' + esc(project.name) + ' screenshot ' + (i + 3) + '">';
              if (remaining[i + 1]) {
                screenshotHtml += '<img src="' + esc(remaining[i + 1]) + '" alt="' + esc(project.name) + ' screenshot ' + (i + 4) + '">';
              }
              screenshotHtml += '</div>';
            }
          }
          screenshotHtml += '</section>';
          html += screenshotHtml;
        }

        // External link
        if (project.live_url) {
          html += '<section class="case-section">' +
            '<div class="two-column">' +
              '<div class="section-label">DON\'T TAKE MY WORD FOR IT</div>' +
              '<div class="section-content">' +
                '<a href="https://' + esc(project.live_url) + '" target="_blank" rel="noopener noreferrer" class="external-link">' + esc(project.live_url) + ' &rarr;</a>' +
              '</div>' +
            '</div>' +
          '</section>';
        }

        // Divider + More Work
        var moreWorkSlugs = project.more_work_slugs || [];
        if (moreWorkSlugs.length > 0) {
          html += '<div class="section-divider"></div>';
          html += '<section class="more-work-section">' +
            '<h2 class="more-work-heading">MORE WORK</h2>' +
            '<div class="more-work-grid" id="more-work-grid"></div>' +
          '</section>';
        }

        sections.innerHTML = html;

        // Fade in
        document.getElementById('page-content').classList.add('loaded');

        // Load more work cards
        if (moreWorkSlugs.length > 0) {
          loadMoreWork(moreWorkSlugs);
        }
      }

      function loadMoreWork(slugs) {
        fetch('/api/projects')
          .then(function(res) { return res.json(); })
          .then(function(allProjects) {
            var grid = document.getElementById('more-work-grid');
            if (!grid) return;

            var cardsHtml = slugs.map(function(s) {
              var p = allProjects.find(function(proj) { return proj.slug === s; });
              if (!p) return '';
              var heroSrc = p.hero_image_url || '/work/' + p.slug + '-hero.webp';
              return '<a href="/project/' + esc(p.slug) + '" class="more-work-card">' +
                '<img src="' + esc(heroSrc) + '" alt="' + esc(p.name) + '">' +
                '<div class="more-work-card-info">' +
                  '<h3>' + esc(p.name).toUpperCase() + '</h3>' +
                  '<p>' + esc(p.tagline) + '</p>' +
                '</div>' +
              '</a>';
            }).join('');

            grid.innerHTML = cardsHtml;
          })
          .catch(function() {});
      }
    </script>
  </body>
</html>
